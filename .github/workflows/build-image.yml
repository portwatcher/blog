name: Build Image
run-name: Build ${{ github.event.client_payload.image_tag || github.event.client_payload.content_sha || github.event.inputs.image_tag || github.ref_name }}

on:
  push:
    branches:
      - main
      - develop
  repository_dispatch:
    types:
      - blog-content-updated
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag override
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: blog-image-${{ github.event.client_payload.content_sha || github.event.inputs.image_tag || github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.IMAGE || format('ghcr.io/{0}', github.repository) }}
  IMAGE_TAG: ${{ github.event.client_payload.image_tag || github.event.client_payload.content_sha || github.event.inputs.image_tag || vars.IMAGE_TAG || github.ref_name }}

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}
