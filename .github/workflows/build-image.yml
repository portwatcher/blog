name: Build Image
run-name: Build ${{ github.event.client_payload.image_tag || github.event.client_payload.content_sha || github.event.inputs.image_tag || github.ref_name }}

on:
  push:
    branches:
      - main
      - develop
  repository_dispatch:
    types:
      - blog-content-updated
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag override
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: blog-image-${{ github.event.client_payload.content_sha || github.event.inputs.image_tag || github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.IMAGE || format('ghcr.io/{0}', github.repository) }}
  IMAGE_TAG: ${{ github.event.client_payload.image_tag || github.event.client_payload.content_sha || github.event.inputs.image_tag || vars.IMAGE_TAG || github.ref_name }}
  CONTENT_REPO: ${{ vars.CONTENT_REPO || format('{0}/blog-content', github.repository_owner) }}
  CONTENT_BRANCH: ${{ vars.CONTENT_BRANCH || 'main' }}
  BLOG_CONTENT_REPOSITORY: ${{ vars.BLOG_CONTENT_REPOSITORY || '' }}
  MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || '' }}

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            BLOG_CONTENT_BRANCH=${{ env.CONTENT_BRANCH }}
            BLOG_CONTENT_REPOSITORY=${{ env.BLOG_CONTENT_REPOSITORY }}
            NUXT_PUBLIC_CMS_CONTENT_REPO=${{ env.CONTENT_REPO }}
            NUXT_PUBLIC_CMS_CONTENT_BRANCH=${{ env.CONTENT_BRANCH }}
            NUXT_PUBLIC_MEDIA_BASE_URL=${{ env.MEDIA_BASE_URL }}
          secrets: |
            blog_content_auth_token=${{ secrets.BLOG_CONTENT_AUTH_TOKEN }}
